<script>
// SONDA DE TESTE (navegador). Quem injeta e o rodar.mjs, numa COPIA do www/
// em pasta temporaria — nunca no www/ nem no public/ do iOS, que vao para as
// lojas. Plugins nativos e rede simulados: nada sai para a producao.
//   #c=asserts             fluxo inteiro conferido, resultado em #resultado-teste
//   #c=rede                envio de recibos com servidor simulado (lento, antigo, sem cota),
//                          e no fim os dados e o envio do caixa (1.8)
//   #c=caixa               as telas do caixa (1.8): dia, mes, lancamento, cartao do
//                          inicio e fim da corrida, conferidos pelos botoes
//   #c=caixa&passo=N       para na tela N do caixa (fotos)
//   #c=menu                o menu do perfil na tela que o rodar.mjs escolheu (telas
//                          baixas): o "Excluir minha conta" tem de aparecer e receber
//                          o toque. &sem_rolar=1: sem rolar o menu; &email=longo
//   #passo=N               para no passo N (fotos)
//   #c=negado&passo=1      localizacao negada
localStorage.clear();
localStorage.setItem('motorista', JSON.stringify({ full_name: 'Teste Navegador', email: 'web@teste.invalid', plate: 'WEB1A23' }));
localStorage.setItem('motorista_id', JSON.stringify('web-motorista'));
const H = new URLSearchParams(location.hash.slice(1));
const NEGADO = H.get('c') === 'negado';
// Modo rede: com sessao, o app envia os recibos, e a sonda faz o papel do
// servidor. __regra(corpo) diz como responder a cada POST /api/recibos.
const REDE = H.get('c') === 'rede';
if (REDE) localStorage.setItem('access_token', JSON.stringify('token-falso'));
// Modo caixa: o mesmo servidor simulado, mas a sessao so entra depois de a
// sonda limpar o banco (ver o fim): sem ela, o app para no login e nao mexe
// nele enquanto o que as outras partes deixaram e apagado.
const CAIXA = H.get('c') === 'caixa';
const SERVIDOR = REDE || CAIXA;
// Modo menu: com sessao e plano Gratis guardados (a linha "2 de 6 recibos"),
// como o motorista abre o menu para excluir a conta.
const MENU = H.get('c') === 'menu';
if (MENU) {
  localStorage.setItem('access_token', JSON.stringify('token-menu'));
  localStorage.setItem('plano', JSON.stringify('free'));
  localStorage.setItem('limite', JSON.stringify(6));
  localStorage.setItem('usados', JSON.stringify(2));
  if (H.get('email') === 'longo') {
    localStorage.setItem('motorista', JSON.stringify({ full_name: 'José Carlos da Silva Pereira', plate: 'WEB1A23',
      email: 'jose.carlos.da.silva.taxista.centro@provedor-de-email-grande.com.br' }));
  }
}
window.__regra = () => ({});
window.__sessao = null;                 // corpo do GET /api/sessao; null = 503
window.__refresh = null;                // {status, corpo} do POST /api/refresh; null = sem rede
window.__refreshes = 0;                 // quantas vezes o app tentou renovar
window.__perfil = null;                 // {status, corpo, atraso} do POST /api/perfil
window.__perfis = [];                   // corpos que o app mandou para /api/perfil
window.__ordem = [];                    // 'recibo' e 'perfil', na ordem em que chegaram
window.__sessaoAtraso = 0;              // ms ate o GET /api/sessao responder
window.__pedidos = [];
window.__regraCaixa = () => ({});       // como responder a cada POST /api/lancamentos (caixa, 1.8)
window.__lotes = [];                    // corpos que o app mandou para /api/lancamentos
window.__avaliacoes = 0;                // quantas vezes o app pediu avaliacao a loja
window.__ouvintes = {};                 // eventos do plugin App ('resume', 'pause', 'appStateChange', 'backButton')
window.Capacitor = {
  isNativePlatform: () => true,
  getPlatform: () => 'ios',
  Plugins: {
    Geolocation: {
      checkPermissions: async () => (NEGADO
        ? { location: 'denied', coarseLocation: 'denied' }
        : { location: 'prompt', coarseLocation: 'prompt' }),
      requestPermissions: async () => ({ location: 'granted', coarseLocation: 'granted' }),
      getCurrentPosition: async () => ({ coords: { latitude: -23.5617, longitude: -46.656 } }),
    },
    NativeGeocoder: {
      reverseGeocode: async () => ({ addresses: [{
        thoroughfare: 'Avenida Paulista', subThoroughfare: '1578',
        subLocality: 'Bela Vista', locality: 'São Paulo' }] }),
    },
    Network: { getStatus: async () => ({ connected: true }), addListener: () => {} },
    App: { addListener: (ev, fn) => { (window.__ouvintes[ev] ||= []).push(fn); } },
    InAppReview: { requestReview: async () => { window.__avaliacoes++; } },
  },
};
window.fetch = async (url, op) => {
  if (String(url).includes('/api/estimativa')) {
    window.__pedidos.push(JSON.parse(op.body));
    await new Promise((ok) => setTimeout(ok, 300));
    if (window.__status) {
      return new Response(JSON.stringify({ erro: 'nao_autenticado' }),
        { status: window.__status, headers: { 'Content-Type': 'application/json' } });
    }
    return new Response(JSON.stringify({ km: 14.2, minutos: 31, minutos_sem_transito: 22 }),
      { status: 200, headers: { 'Content-Type': 'application/json' } });
  }
  const json = (corpo, status) => new Response(JSON.stringify(corpo),
    { status, headers: { 'Content-Type': 'application/json' } });
  if (SERVIDOR && String(url).endsWith('/api/recibos') && op && op.method === 'POST') {
    const corpo = JSON.parse(op.body);
    window.__ordem.push('recibo');
    const regra = window.__regra(corpo) || {};
    await new Promise((ok) => setTimeout(ok, regra.atraso || 0));
    if (regra.falhar) throw new TypeError('sonda: a conexao caiu');
    return json(regra.corpo || { rid: corpo.rid, url: 'https://exemplo.invalid/recibo/' + corpo.rid, criado_agora: true },
                regra.status || 201);
  }
  if (SERVIDOR && String(url).endsWith('/api/sessao')) {
    await new Promise((ok) => setTimeout(ok, window.__sessaoAtraso || 0));
    return window.__sessao ? json(window.__sessao, 200) : json({}, 503);
  }
  if (SERVIDOR && String(url).endsWith('/api/refresh')) {
    window.__refreshes++;
    if (!window.__refresh) throw new TypeError('sonda: sem rede');
    await new Promise((ok) => setTimeout(ok, window.__refresh.atraso || 0));
    return json(window.__refresh.corpo || {}, window.__refresh.status);
  }
  if (SERVIDOR && String(url).endsWith('/api/perfil')) {
    window.__perfis.push(JSON.parse(op.body));
    window.__ordem.push('perfil');
    const p = window.__perfil || { status: 503, corpo: {} };
    await new Promise((ok) => setTimeout(ok, p.atraso || 0));
    return json(p.corpo || {}, p.status);
  }
  if (SERVIDOR && /\/api\/recibos\/[A-Z0-9]+\/email$/.test(String(url))) {
    return json({}, window.__email_status || 200);
  }
  // O caixa sobe no fim de cada passada da fila. Sem esta resposta, cada
  // passada do modo rede acabaria em "rede caida" e reagendaria a seguinte.
  // __regraCaixa(corpo) pode atrasar, derrubar a conexao, mudar o status ou
  // recusar alguns ids ({recusados: [{id, erro}]}); o resto volta aceito.
  if (SERVIDOR && String(url).endsWith('/api/lancamentos') && op && op.method === 'POST') {
    const corpo = JSON.parse(op.body);
    window.__lotes.push(corpo);
    const regra = window.__regraCaixa(corpo) || {};
    await new Promise((ok) => setTimeout(ok, regra.atraso || 0));
    if (regra.falhar) throw new TypeError('sonda: a conexao caiu');
    const recusados = regra.recusados || [];
    const aceitos = (corpo.lancamentos || []).map((l) => l.id).filter((id) => !recusados.some((x) => x.id === id));
    return json(regra.corpo || { aceitos, recusados }, regra.status || 200);
  }
  throw new TypeError('sonda: sem rede');
};
// O <a> do Waze e do Maps navegaria a pagina para fora. O ouvinte do app roda
// antes (no proprio elemento); este, no documento, so impede a saida.
document.addEventListener('click', (e) => {
  if (e.target.closest('a[href^="https://"]')) e.preventDefault();
});

window.addEventListener('load', async () => {
  const q = (id) => document.getElementById(id);
  const espera = (ms) => new Promise((ok) => setTimeout(ok, ms));
  const digitar = (id, v) => { q(id).value = v; q(id).dispatchEvent(new Event('input')); };
  const clicar = (id) => q(id).dispatchEvent(new MouseEvent('click', { cancelable: true, bubbles: true }));
  // Le o QR da tela com o leitor do proprio Chrome, como a camera do
  // passageiro leria. null quando este Chrome nao tem o leitor.
  const lerQr = async (svg) => {
    if (!('BarcodeDetector' in window)) return null;
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.outerHTML);
    await img.decode();
    const tela = document.createElement('canvas');
    tela.width = tela.height = 400;
    tela.getContext('2d').drawImage(img, 0, 0, 400, 400);
    const achados = await new BarcodeDetector({ formats: ['qr_code'] }).detect(tela);
    return achados.length ? achados[0].rawValue : '';
  };
  const terminar = (linhas) => {
    const pre = document.createElement('pre');
    pre.id = 'resultado-teste';
    pre.textContent = linhas.join('\n');
    document.body.appendChild(pre);
  };

  if (MENU) {
    // ── Menu do perfil numa tela baixa ──────────────────────────────────────
    // O menu mora no cabecalho fixo: rolar a pagina nao o move. Com o "Meu
    // caixa" (1.8), o "Excluir minha conta" (exigido pela Apple e pelo Google,
    // e a unica entrada do app para excluir) saia pelo pe da tela no iPhone
    // SE/8 e nos Androids pequenos. O rodar.mjs escolhe o tamanho da tela.
    const r = [];
    const tela = `${innerWidth}x${innerHeight}${H.get('email') === 'longo' ? ', e-mail longo' : ''}`;
    const ok = (nome, cond, extra = '') => r.push(`${cond ? 'OK   ' : 'FALHA'} menu (${tela}): ${nome}${cond ? '' : ' :: ' + extra}`);
    try {
      vitrineCheiaNestaAbertura = true;   // os planos em tela cheia nao entram no meio
      await espera(1500);
      irParaInicio(); await espera(200);
      clicar('btn-perfil'); await espera(300);
      const menu = q('menu-perfil'), ex = q('btn-excluir-conta');
      const caixa = (el) => el.getBoundingClientRect();
      const tocavel = () => {
        const e = caixa(ex);
        const alvo = document.elementFromPoint(e.left + e.width / 2, e.top + e.height / 2);
        return alvo === ex || ex.contains(alvo);
      };
      const onde = () => JSON.stringify({ excluir: [Math.round(caixa(ex).top), Math.round(caixa(ex).bottom)], menu: Math.round(caixa(menu).bottom), tela: innerHeight });
      ok('o menu abre sem passar do pe da tela', !menu.hidden && caixa(menu).bottom <= innerHeight, onde());
      if (H.get('sem_rolar')) {
        ok('"Excluir minha conta" aparece inteiro e recebe o toque sem rolar nada', caixa(ex).bottom <= caixa(menu).bottom && tocavel(), onde());
      }
      ex.scrollIntoView({ block: 'nearest' }); await espera(200);
      ok('"Excluir minha conta" aparece inteiro e recebe o toque (rolando o menu, se preciso)', caixa(ex).top >= caixa(menu).top
         && caixa(ex).bottom <= caixa(menu).bottom && caixa(ex).bottom <= innerHeight && tocavel(), onde());
      const baixos = [...menu.querySelectorAll('.menu-item')].filter((b) => b.getBoundingClientRect().height < 44);
      ok('todo item do menu com alvo de 44 px ou mais', baixos.length === 0, baixos.map((b) => b.textContent).join('|'));
      clicar('btn-excluir-conta'); await espera(300);
      ok('o toque em "Excluir minha conta" abre a exclusao', !q('tela-excluir').hidden);
    } catch (e) {
      r.push(`FALHA menu: excecao: ${e && e.stack || e}`);
    }
    terminar(r);
    return;
  }

  if (REDE) {
    const r = [];
    const ok = (nome, cond, extra = '') => r.push(`${cond ? 'OK   ' : 'FALHA'} rede: ${nome}${cond ? '' : ' :: ' + extra}`);
    const achar = async (origem) => (await listarRecibos()).find((x) => x.dados.origem === origem);
    const emitir = async (origem, valor, contato = {}) => {
      await irParaEmitir(); await espera(100);
      q('passageiro').value = ''; q('origem').value = origem; q('destino').value = 'Centro'; q('valor').value = valor;
      q('whats').value = contato.whats || ''; q('email-passageiro').value = contato.email || '';
      q('form-recibo').requestSubmit();
    };
    try {
      // O caixa dos recibos do modo asserts tambem sai: subiria aqui, no meio dos testes.
      await espera(500); await limparRecibosLocais(); await limparLancamentosLocais();

      // Sinal fraco: o envio do 1o recibo demora; o motorista emite o 2o nesse
      // meio-tempo, e o 2o sobe antes. Quando o envio lento termina, a tela
      // tem de continuar no 2o: o passageiro novo le o QR que esta ali.
      let lentos = 0;
      window.__regra = (c) => (c.origem === 'Origem lenta' && lentos++ === 0 ? { atraso: 2500 } : {});
      await emitir('Origem lenta', '30');
      await espera(500);
      await emitir('Origem rapida', '40');
      await espera(3500);
      const segundo = await achar('Origem rapida');
      const noCartao = (q('recibo').querySelector('.recibo-id') || {}).textContent;
      ok('envio lento do recibo anterior nao troca a tela', segundo && noCartao === '#' + segundo.rid, `${noCartao} x ${segundo && segundo.rid}`);
      const lido = await lerQr(q('recibo').querySelector('svg.qr'));
      ok('o QR da tela e o do recibo aberto', segundo && (lido === null || lido === linkDoRecibo(segundo)), lido);

      // Servidor anterior ao nome opcional: recusa o recibo sem nome.
      window.__regra = (c) => (!c.passageiro ? { status: 400, corpo: { erro: 'campos_obrigatorios' } } : {});
      await emitir('Servidor antigo', '25');
      await espera(1200);
      let antigo = await achar('Servidor antigo');
      ok('servidor antigo: o recibo sem nome fica recusado', antigo && antigo.recusado === 'campos_obrigatorios', JSON.stringify(antigo && antigo.recusado));
      ok('a tela explica, sem QR', !q('recibo').querySelector('svg.qr')
         && q('recibo').textContent.includes('Sem QR neste recibo') && q('recibo').textContent.includes('faltou um campo obrigatório'));
      window.__regra = () => ({});
      window.__sessao = { id: 'web-motorista', plano: 'free', limite_mensal: 6, usados_no_mes: 1,
                          motorista: { full_name: 'Teste Navegador', plate: 'WEB1A23' } };
      await atualizarSessao(); await sincronizar();
      antigo = await achar('Servidor antigo');
      ok('sem o sinal do servidor novo, ele nao volta para a fila', antigo && antigo.recusado === 'campos_obrigatorios');
      window.__sessao = { ...window.__sessao, passageiro_opcional: true };
      await atualizarSessao(); await sincronizar();
      antigo = await achar('Servidor antigo');
      ok('com o sinal, ele volta para a fila e sobe', antigo && !antigo.recusado && !antigo.pendente && !!antigo.url, JSON.stringify(antigo && { r: antigo.recusado, p: antigo.pendente }));

      // Limite do plano Gratis: a tela do Pro diz que o recibo ficou sem QR,
      // e "Agora nao" volta para o recibo, onde esta o aviso.
      window.__regra = () => ({ status: 402, corpo: { erro: 'limite_mensal', limite: 6 } });
      await emitir('Sem cota', '20');
      await espera(1500);
      ok('limite: a tela do Pro avisa que o recibo ficou sem QR',
         !q('tela-assinatura').hidden && q('motivo-pro').textContent.includes('sem link e sem QR'), q('motivo-pro').textContent);
      clicar('btn-fechar-pro');
      ok('"Agora não" volta para o recibo, com o aviso do Pro',
         !q('tela-recibo').hidden && q('recibo').textContent.includes('Assinando o Pro'));
      const semCota = await achar('Sem cota');
      ok('o WhatsApp do recibo recusado sai sem o link', semCota && !textoParaCompartilhar(semCota).includes('/recibo/'));
      // A tela do Pro aberta pelo menu, depois, volta para a tela de base.
      clicar('btn-pro'); await espera(100);
      clicar('btn-fechar-pro');
      ok('aberta pelo menu, "Agora não" segue para a tela de base', q('tela-recibo').hidden && q('tela-assinatura').hidden);

      // Pedido de avaliacao: so na volta de uma entrega, a partir do 3o recibo
      // aceito (aqui ja sao 3; o "Sem cota" foi recusado e nao conta).
      // A volta ao app tambem rele a sessao (desde a vitrine, 2026-11-14), e
      // esta sessao simulada diz que ha vaga: o "Sem cota" seria reaberto e
      // aceito, o que e certo no app, mas desmonta estes testes e os da cota
      // logo abaixo. A releitura fica pausada aqui; a vitrine a testa de proposito.
      sessaoRelidaEm = Date.now() + 10 * 60e3;
      const voltarAoApp = () => (window.__ouvintes.resume || []).forEach((f) => f());
      const entregarEVoltar = async () => { clicar('btn-whats'); voltarAoApp(); await espera(1300); };
      window.__regra = () => ({});
      voltarAoApp(); await espera(1300);
      ok('avaliacao: voltar ao app sem entregar nao pede', __avaliacoes === 0, String(__avaliacoes));
      guardarCorrida({ motorista: 'web-motorista', destino: 'Centro', inicio: new Date().toISOString() });
      await emitir('Com WhatsApp', '35', { whats: '11987654321' });
      await espera(1200);
      await entregarEVoltar();
      ok('avaliacao: com corrida aberta nao pede', __avaliacoes === 0, String(__avaliacoes));
      apagarCorrida();
      entregueEm = 0; clicar('btn-whats'); entregueEm -= 11 * 60e3; voltarAoApp(); await espera(1300);
      ok('avaliacao: voltar mais de 10 min depois da entrega nao pede', __avaliacoes === 0, String(__avaliacoes));
      await entregarEVoltar();
      ok('avaliacao: entregou pelo WhatsApp e voltou, pede', __avaliacoes === 1, String(__avaliacoes));
      await entregarEVoltar();
      ok('avaliacao: o mesmo marco nao pede de novo', __avaliacoes === 1, String(__avaliacoes));
      Guardado.set('avaliacao_marco', 0);
      await entregarEVoltar();
      ok('avaliacao: menos de 30 dias depois do ultimo pedido nao pede', __avaliacoes === 1, String(__avaliacoes));
      Guardado.set('avaliacao_pedida_em', Date.now() - 31 * 864e5);
      const comWhats = await achar('Com WhatsApp');
      clicar('btn-novo'); await espera(100);
      depoisDeEntregar(comWhats.rid); await espera(1300);
      ok('avaliacao: fora da tela do recibo nao pede', __avaliacoes === 1, String(__avaliacoes));
      abrirRecibo(comWhats);
      depoisDeEntregar(comWhats.rid); await espera(1300);
      ok('avaliacao: depois de compartilhar o PDF, pede', __avaliacoes === 2, String(__avaliacoes));
      // Recibo recusado por limite: entregar o texto sem link nao e hora de pedir nota.
      Guardado.set('avaliacao_marco', 0); Guardado.set('avaliacao_pedida_em', 0);
      abrirRecibo(semCota);
      depoisDeEntregar(semCota.rid); await espera(1300);
      ok('avaliacao: recibo recusado entregue nao pede', __avaliacoes === 2, String(__avaliacoes));
      abrirRecibo(comWhats);
      depoisDeEntregar(comWhats.rid); await espera(1300);
      ok('avaliacao: o aceito, na mesma condicao, pede', __avaliacoes === 3, String(__avaliacoes));

      // created_at: a hora em que o recibo nasceu vai no envio, para o
      // servidor datar certo o recibo emitido sem sinal.
      let corpoVisto = null;
      window.__regra = (c) => { corpoVisto = c; return {}; };
      await emitir('Com created_at', '12');
      await espera(1200);
      const comData = await achar('Com created_at');
      ok('o envio leva created_at igual ao criado_em', corpoVisto && comData && corpoVisto.created_at === comData.criado_em
         && /^\d{4}-\d{2}-\d{2}T/.test(corpoVisto.created_at), JSON.stringify(corpoVisto && corpoVisto.created_at));
      ok('o recibo leva o dono', comData && comData.dono === 'web-motorista', JSON.stringify(comData && comData.dono));

      // 402 para quem acabou de perder o Pro: o limite vem na resposta, nao
      // do que ficou guardado ("ilimitado" = null). E a tela do Pro abre uma
      // vez por passada, mesmo com dois recibos na fila.
      Guardado.set('limite', null);
      const redeDoAparelho = window.Capacitor.Plugins.Network;
      redeDoAparelho.getStatus = async () => ({ connected: false });   // dois recibos sem sinal
      await emitir('Sem cota 2', '21'); await espera(300);
      await emitir('Sem cota 3', '22'); await espera(300);
      ok('sem sinal, os dois ficam na fila', (await pendentes()).length === 2, String((await pendentes()).length));
      redeDoAparelho.getStatus = async () => ({ connected: true });
      let aberturas = 0;
      const abrirAssinaturaOriginal = abrirAssinatura;
      window.abrirAssinatura = (motivo) => { aberturas++; return abrirAssinaturaOriginal(motivo); };
      window.__regra = () => ({ status: 402, corpo: { erro: 'limite_mensal', limite: 6 } });
      await sincronizar(); await espera(100);
      const semCota2 = await achar('Sem cota 2'), semCota3 = await achar('Sem cota 3');
      ok('402: os dois ficam recusados por limite', semCota2 && semCota3 && semCota2.recusado === 'limite_mensal' && semCota3.recusado === 'limite_mensal');
      ok('402: a frase traz o limite da resposta, nao o guardado', q('motivo-pro').textContent.includes('os 6 recibos'), q('motivo-pro').textContent);
      ok('402: a tela do Pro abriu uma vez na passada, nao uma por recibo', aberturas === 1, String(aberturas));
      window.abrirAssinatura = abrirAssinaturaOriginal;
      clicar('btn-fechar-pro');

      // Vaga unica: dos tres recusados por limite, so o mais antigo volta para a fila.
      window.__regra = () => ({});
      window.__sessao = { ...window.__sessao, limite_mensal: 6, usados_no_mes: 5 };
      await atualizarSessao();
      const reabertos = (await listarRecibos()).filter((x) => x.pendente || (!x.recusado && x.dados.origem.startsWith('Sem cota')));
      ok('reabre so quantos cabem na cota (1 vaga, 1 reaberto)', reabertos.length === 1 && reabertos[0].dados.origem === 'Sem cota', JSON.stringify(reabertos.map((x) => x.dados.origem)));
      await sincronizar();
      window.__sessao = { ...window.__sessao, limite_mensal: null, usados_no_mes: 6 };
      await atualizarSessao(); await sincronizar();
      ok('sem limite, todos os recusados por cota sobem', (await listarRecibos()).every((x) => !x.pendente && x.recusado !== 'limite_mensal'));

      // Sessao: 503 na renovacao nao derruba; 401 derruba.
      window.__regra = () => ({ status: 401, corpo: { erro: 'nao_autenticado' } });
      Guardado.set('refresh_token', 'refresh-falso');

    ok('recibo avulso sai sem a marca', recibos.length === 2 && avulso && avulso.dados.via_corrida === undefined, JSON.stringify(avulso && avulso.dados));
    ok('duplo toque em Gerar recibo nao duplica', recibos.filter((x) => x.dados.passageiro === 'Avulso').length === 1, String(recibos.length));
    ok('o recibo nasce com created_at e dono', avulso && avulso.dados.created_at === avulso.criado_em && avulso.dono === 'web-motorista', JSON.stringify(avulso && [avulso.dados.created_at, avulso.dono]));
    ok('o link do recibo e no dominio proprio', linkDoRecibo(avulso) === 'https://www.recibotaxi.com.br/recibo/' + avulso.rid, linkDoRecibo(avulso));
    localStorage.setItem('codigo_indicacao', JSON.stringify('ABC123'));
    ok('o convite e no dominio proprio', mensagemDeIndicacao().includes('https://www.recibotaxi.com.br/i/ABC123'), mensagemDeIndicacao());
    localStorage.removeItem('codigo_indicacao');
    // PDF: endereco longo quebra em linhas, e o que passa de duas termina em reticencias.
    ok('quebrarLinhas: cabe em uma', JSON.stringify(quebrarLinhas('Rua Augusta, 100', 12)) === JSON.stringify(['Rua Augusta, 100']));
    const longo = 'Avenida Brigadeiro Faria Lima, 3477, Torre Sul, 14o andar, Itaim Bibi, Sao Paulo, SP, CEP 04538-133, portaria principal';
    const quebrado = quebrarLinhas(longo, 12);
    ok('quebrarLinhas: por palavra, sem estourar a margem', quebrado.length === 2 && quebrado.every((l) => larguraDe(l, 12) <= 483) && quebrado.join(' ') === longo, JSON.stringify(quebrado));
    const tresLinhas = quebrarLinhas(longo + ' ' + longo, 12, 2);
    ok('quebrarLinhas: com teto, a ultima termina em reticencias', tresLinhas.length === 2 && tresLinhas[1].endsWith('…'), JSON.stringify(tresLinhas));
    const pdfLongo = atob(pdfDoRecibo({ ...avulso, dados: { ...avulso.dados, origem: longo } }));
    ok('o PDF escreve o endereco longo em duas linhas', pdfLongo.includes('(' + quebrado[0] + ')') && pdfLongo.includes('(' + quebrado[1] + ')') && !pdfLongo.includes('(' + longo + ')'));

    // Sem nome, sem telefone e sem e-mail (2026-10): o recibo chega ao
    // passageiro pelo QR, lido com a camera do celular dele.
    clicar('btn-ir-emitir'); await espera(200);
    ok('o nome do passageiro e opcional', !q('passageiro').required);
    q('passageiro').value = ''; q('origem').value = 'Praça da Sé'; q('destino').value = 'Paulista'; q('valor').value = '23,50';
    q('form-recibo').requestSubmit(); await espera(900);
    const semNome = (await listarRecibos()).find((x) => x.dados.origem === 'Praça da Sé');
    ok('recibo sem nome do passageiro e emitido', !!semNome && semNome.dados.passageiro === '', JSON.stringify(semNome && semNome.dados));
    ok('sem nome, o recibo nao tem a linha Passageiro',
       ![...q('recibo').querySelectorAll('dt')].some((dt) => dt.textContent === 'Passageiro'));
    const svgQr = q('recibo').querySelector('svg.qr');
    ok('o recibo mostra o QR', !!svgQr);
    ok('sem contato do passageiro, o QR vem aberto, antes dos dados', svgQr && !svgQr.closest('details')
       && !!(q('recibo').querySelector('.recibo-qr').compareDocumentPosition(q('recibo').querySelector('dl')) & Node.DOCUMENT_POSITION_FOLLOWING));
    ok('e cabe na tela sem rolar (390 x 844)', svgQr && svgQr.getBoundingClientRect().bottom <= window.innerHeight,
       svgQr && `${Math.round(svgQr.getBoundingClientRect().bottom)} > ${window.innerHeight}`);
    ok('na fila, a legenda diz que ainda nao foi enviado e quando aparece',
       (q('recibo').querySelector('.recibo-qr-legenda') || {}).textContent?.includes('Ainda não enviado'));
    const lido = svgQr ? await lerQr(svgQr) : '';
    if (lido === null) r.push('OK    (QR nao lido: este Chrome nao tem o BarcodeDetector)');
    else ok('o QR da tela leva ao link do recibo', semNome && lido === linkDoRecibo(semNome), `lido "${lido}"`);
    ok('o texto do WhatsApp sai sem a linha do passageiro', semNome && !textoParaCompartilhar(semNome).includes('Passageiro'));
    const pdfQr = semNome ? atob(pdfDoRecibo(semNome, { link: linkDoRecibo(semNome), qr: qrDoRecibo(semNome) })) : '';
    ok('o PDF leva o QR e o link, sem a linha do passageiro',
       pdfQr.includes(' re f Q') && pdfQr.includes(linkDoRecibo(semNome)) && !pdfQr.includes('PASSAGEIRO'));
    mostrarRecibo({ ...semNome, pendente: false, recusado: 'limite_mensal' });
    ok('recibo recusado: sem QR, com o motivo e o caminho', !q('recibo').querySelector('svg.qr')
       && q('recibo').textContent.includes('Sem QR neste recibo') && q('recibo').textContent.includes('Assinando o Pro'));
    ok('recibo recusado: o WhatsApp sai sem o link', !textoParaCompartilhar({ ...semNome, recusado: 'limite_mensal' }).includes('/recibo/'));
    mostrarRecibo({ ...semNome, pendente: false });
    ok('no ar, a legenda diz que abre no navegador',
       (q('recibo').querySelector('.recibo-qr-legenda') || {}).textContent?.includes('abre no navegador'));
    // Com WhatsApp do passageiro, o QR vem recolhido e nao empurra os botoes.
    const comContato = { ...semNome, pendente: false, dados: { ...semNome.dados, whatsapp_passageiro: '11987654321' } };
    mostrarRecibo(comContato);
    const recolhido = q('recibo').querySelector('details.recibo-qr');
    ok('com contato, o QR vem recolhido', !!recolhido && !recolhido.open);
    if (recolhido) recolhido.open = true;
    mostrarRecibo(comContato);
    ok('redesenhar o mesmo recibo nao fecha o QR aberto', !!q('recibo').querySelector('details.recibo-qr[open]'));
    mostrarRecibo({ ...comContato, rid: 'OUTRO000000000' });
    ok('outro recibo abre com o QR recolhido de novo', !q('recibo').querySelector('details.recibo-qr[open]'));
    abrirRecibo(semNome);
    ok('o PDF de quem cobra em colon sai com CRC, nao com ?',
       atob(pdfDoRecibo({ ...semNome, dados: { ...semNome.dados, moeda: 'CRC', moeda_simbolo: '₡' } })).includes('(CRC 23,50)'));
    ok('o € e a pontuacao do iPhone saem certos no PDF', (() => {
      const p = atob(pdfDoRecibo({ ...semNome, dados: { ...semNome.dados, moeda: 'EUR', moeda_simbolo: '€', origem: 'D’Ávila – “Centro”' } }));
      return p.includes('(\x80 23,50)') && p.includes('(D\x92Ávila \x96 \x93Centro\x94)');
    })());
    // Cooperativa do motorista (perfil do site): cartao, WhatsApp e PDF.
    const comCoop = { ...semNome, motorista: { ...semNome.motorista, full_name: 'Teste Navegador', plate: 'WEB1A23', coop_name: 'Coopertáxi Cascavel', coop_cnpj: '11.222.333/0001-81' } };
    mostrarRecibo(comCoop);
    ok('o cartao mostra a cooperativa com o CNPJ', [...q('recibo').querySelectorAll('dd')].some((dd) => dd.textContent === 'Coopertáxi Cascavel · CNPJ 11.222.333/0001-81'));
    ok('o WhatsApp leva a cooperativa', textoParaCompartilhar(comCoop).includes('🚖 Cooperativa: Coopertáxi Cascavel · CNPJ 11.222.333/0001-81'));
    ok('o PDF leva a cooperativa', atob(pdfDoRecibo(comCoop)).includes('(Cooperativa Coopertáxi Cascavel - CNPJ 11.222.333/0001-81)'));
    mostrarRecibo(semNome);
    ok('sem cooperativa, nada muda', !textoParaCompartilhar(semNome).includes('Cooperativa') && ![...q('recibo').querySelectorAll('dt')].some((dt) => dt.textContent === 'Cooperativa'));
    clicar('btn-historico'); await espera(200);
    ok('no historico, sem nome, a rota vira o titulo',
       q('lista-historico').textContent.includes('Praça da Sé → Paulista') && q('lista-historico').textContent.includes('sem nome do passageiro'));

    irParaInicio(); clicar('btn-tarifa');
    ok('a tarifa pelo menu abre preenchida', !q('tela-tarifa').hidden && q('t-km2').value === '4,55', q('t-km2').value);
    clicar('btn-fechar-tarifa');
    ok('fechar a tarifa volta ao inicio', !q('tela-inicio').hidden);
    clicar('btn-historico'); await espera(200);
    ok('o historico abre', !q('tela-historico').hidden);
    clicar('btn-voltar');
    ok('voltar do historico vai ao inicio', !q('tela-inicio').hidden);

    await abrirCorrida(); digitar('corrida-destino', 'Centro'); clicar('btn-comecar');
    encerrarSessao();
    ok('sair nao apaga a corrida (o 401 tambem sai), e a tarifa fica',
       !!localStorage.getItem('corrida') && !!localStorage.getItem('tarifa'));
    // O mesmo motorista entra de novo: a corrida continua.
    localStorage.setItem('motorista_id', JSON.stringify('web-motorista'));
    ok('o mesmo motorista encontra a corrida ao entrar de novo', corridaAtual() && corridaAtual().destino === 'Centro');
    // Outro motorista entra no mesmo aparelho: a corrida some.
    localStorage.setItem('motorista_id', JSON.stringify('outro'));
    ok('corrida de outro motorista nao aparece', corridaAtual() === null && !localStorage.getItem('corrida'));
    // Antes da primeira /api/sessao nao ha id: o e-mail identifica o dono.
    localStorage.removeItem('motorista_id');
    localStorage.setItem('motorista', JSON.stringify({ full_name: 'Sem Id', email: 'semid@teste.invalid' }));
    await abrirCorrida(); digitar('corrida-destino', 'Praça'); clicar('btn-comecar');
    ok('sem id, a corrida leva o e-mail como dono', corrida().motorista === 'semid@teste.invalid');
    digitar('corrida-origem', 'Rua Y, 1');
    window.__status = 401;
    await estimar();
    window.__status = null;
    ok('401 na estimativa leva ao login e a corrida fica', !q('tela-login').hidden && !!localStorage.getItem('corrida'));
  } catch (e) {
    r.push(`FALHA excecao: ${e && e.stack || e}`);
  }
  const pre = document.createElement('pre');
  pre.id = 'resultado-teste';
  pre.textContent = r.join('\n');
  document.body.appendChild(pre);
});
</script>
